services:
  postgres:
    image: postgres:16-alpine
    container_name: project-management-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: project_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - project_management_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  project_management_postgres_data: